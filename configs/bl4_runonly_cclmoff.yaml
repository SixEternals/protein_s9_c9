# BL4-Run-only: RNA-FM + Run fusion on CCLMoff (group-safe split)
# Renamed from BL3-RNAFM-Fusion per AGENTS.md v3 constraint #15.
version: "BL4-Run-only"

dataset:
  file: data/cclmoff/cclmoff_9bit.npz
  group_csv: data/cclmoff/09212024_CCLMoff_dataset.csv
  group_column: sgRNA_type

run_encoder:
  weight_mode: soft
  tau: 4.0

model:
  name: BL3RNAFMFusion

rnafm:
  checkpoint_path: data/rnafm/checkpoints/RNA-FM_pretrained.pth
  freeze_rnafm: true
  repr_layer: 12
  embeddings_path: data/cclmoff/cclmoff_rnafm_embeddings.npz

model_config:
  freeze_rnafm: true
  repr_layer: 12
  rnafm_dim: 640
  run:
    hidden_dim: 128
    dropout: 0.2
  mlp_hidden: 256
  dropout: 0.2

training:
  batch_size: 2048
  num_workers: 8
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  epochs: 50
  monitor: auprc
  monitor_mode: max
  gradient_clip: null

seed: 42

outputs:
  dir: results/bl4_runonly_cclmoff
  experiments_csv: results/experiments.csv
