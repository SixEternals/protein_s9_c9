# BL5-v4-RNAFM-PAM-noRun-control: RNA-FM CLS + PAM Encoder, no Run/LearnableRun.
# 2-view ablation to complete the 2×2 component matrix.
version: "BL5-v4-RNAFM-PAM-noRun"
description: "fine-tune RNA-FM CLS + PAM Encoder concat, no Run/LearnableRun"

model:
  name: BL5RunOnlyDynamicFusion
  use_rnafm: true
  freeze_rnafm: false
  use_run: false
  use_learnable_run: false
  use_region: false
  fusion_type: rnafm_pam_concat
  rna_pooling: cls
  use_pam_encoder: true
  pam_dim: 16
  repr_layer: 12
  rnafm_dim: 640
  d_model: 128
  classifier_hidden: 256
  mlp_activation: relu
  dropout: 0.3
  dropout2: 0.2

rnafm:
  checkpoint_path: data/rnafm/checkpoints/RNA-FM_pretrained.pth
  freeze_rnafm: false
  repr_layer: 12

training:
  epochs: 10
  # Route A GPU-saturating batch size (controlled comparison).
  batch_size: 1024
  lr_transformer: 5.0e-4
  lr_pam_encoder: 1.0e-3
  lr_mlp: 1.0e-3
  lr: 1.0e-3
  warmup_epochs: 5
  optimizer: AdamW
  use_param_groups: true
  focal_loss: true
  focal_gamma: 2.0
  gradient_clip: 1.0
  num_workers: 12
  persistent_workers: true
  prefetch_factor: 4
  find_unused_parameters: true
  weight_decay: 1.0e-5
  monitor: auprc
  monitor_mode: max

split_mode: sgrna_safe

data:
  cclmoff_csv: data/cclmoff/09212024_CCLMoff_dataset.csv
  npz_path: data/cclmoff/cclmoff_9bit.npz
  group_column: sgRNA_type

evaluation:
  checkpoint_type: best
  report_metrics: [AUROC, AUPRC]
  compare_baselines:
    bl0b_auprc: 0.522282
    bl5_v4_pam_auprc: 0.518032
    bl5_v4_pam_only_auprc: 0.0592
    bl5_v4_learnablerun_only_auprc: 0.2949

hardware:
  gpu_count: 2
  use_amp: true
  use_ddp: true

output_dir: results/bl5_v4_rnafm_pam_norun_control
