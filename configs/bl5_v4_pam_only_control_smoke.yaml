# BL5-v4-PAM-only-control Smoke Test
version: "BL5-v4-PAM-only-control-Smoke"
description: "smoke test for PAM-only ablation"

model:
  name: BL5RunOnlyDynamicFusion
  use_rnafm: false
  freeze_rnafm: false
  use_run: false
  use_learnable_run: false
  use_region: false
  use_pam_encoder: true
  fusion_type: pam_only
  pam_dim: 16
  mlp_hidden: 256
  mlp_hidden2: 64
  mlp_activation: relu
  dropout: 0.3
  dropout2: 0.2

rnafm:
  checkpoint_path: data/rnafm/checkpoints/RNA-FM_pretrained.pth
  freeze_rnafm: false
  repr_layer: 12

training:
  epochs: 1
  batch_size: 128
  lr_pam_encoder: 1.0e-3
  lr_mlp: 1.0e-3
  lr: 1.0e-3
  warmup_epochs: 0
  optimizer: AdamW
  use_param_groups: true
  focal_loss: true
  focal_gamma: 2.0
  gradient_clip: 1.0
  num_workers: 2
  persistent_workers: false
  prefetch_factor: 2
  find_unused_parameters: false
  weight_decay: 1.0e-5
  monitor: auprc
  monitor_mode: max
  max_train_batches: 5
  max_eval_batches: 5

split_mode: sgrna_safe

split:
  strategy: formal_group_json
  formal_split_json: formal_split_bl5_seed42.json
  group_column: sgRNA_type

data:
  cclmoff_csv: data/cclmoff/09212024_CCLMoff_dataset.csv
  npz_path: data/cclmoff/cclmoff_9bit.npz
  group_column: sgRNA_type

evaluation:
  checkpoint_type: best
  report_metrics: [AUROC, AUPRC]

hardware:
  gpu_count: 1
  use_amp: true
  use_ddp: false

output_dir: results/smoke_tests/bl5_v4_pam_only_control_smoke

outputs:
  experiment_csv: results/experiments.csv
  export_test_predictions: false
  notes: "smoke test only"
