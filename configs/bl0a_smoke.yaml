# BL0a smoke training config.
# This is a tiny CCLMoff CSV training-chain check, not a full experiment.

model: bl0a_rnafm_mlp
seed: 42
device: auto

dataset:
  csv_path: data/cclmoff/09212024_CCLMoff_dataset.csv
  max_rows: 512
  observed_positive_cap: 8
  unobserved_candidate_cap: 8
  replace_t_with_u: true

rnafm:
  checkpoint_path: data/rnafm/checkpoints/RNA-FM_pretrained.pth
  allow_download: false
  freeze: true
  repr_layer: 12

model_config:
  input_dim: 640
  head_type: official_mlp
  transformer_dim: 640
  transformer_layers: 1
  attention_heads: 8
  ffn_dim: 1024
  mlp_hidden_dim: 64
  dropout: 0.2
  pool: cls

training:
  epochs: 1
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 0
  use_balanced_sampler: true

outputs:
  output_dir: results/bl0a_smoke_train
  experiment_csv: results/experiments.csv
