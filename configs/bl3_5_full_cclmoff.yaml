# BL3.5-Full: C9 Run + R9 Region bidirectional Cross-Attn + Residual + LayerNorm
# AGENTS.md compliance: use_rnafm=False, split_mode=sgrna_safe
version: "BL3.5-Full"

dataset:
  file: data/cclmoff/cclmoff_9bit.npz
  group_csv: data/cclmoff/09212024_CCLMoff_dataset.csv
  group_column: sgRNA_type

run_encoder:
  weight_mode: soft
  tau: 4.0

model:
  name: BL35FullFusion

model_config:
  hidden_dim: 128
  num_heads: 4
  dropout: 0.2
  cnn_channels: [64, 128]

training:
  batch_size: 2048
  num_workers: 8
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  epochs: 50
  monitor: auprc
  monitor_mode: max
  gradient_clip: null

seed: 42

outputs:
  dir: results/bl3_5_full_cclmoff
  experiments_csv: results/experiments.csv
