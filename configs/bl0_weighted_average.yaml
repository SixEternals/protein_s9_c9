name: BL0-P0-weighted-average
description: Weighted average of existing DeepFocus/R9 and ConMismatch9/C9 checkpoints.
seed: 43
device: auto

dataset:
  name: GUIDE-seq
  file: /data/zwf/project/zhb/data/GUIDE-seq/GUIDE-seq_9bit.npz
  label_semantics:
    1: observed_positive
    0: unobserved_candidate

checkpoints:
  region_r9: artifacts/full_upgrade_guide_seq_deepfocus/seed_43/full/deepfocus_r9_GUIDE_seq.pt
  run_c9: artifacts/full_upgrade_guide_seq_conmismatch9/seed_43/full/conmismatch9_c9_GUIDE_seq.pt

feature_cache:
  region_r9: runs/full_upgrade_guide_seq_deepfocus/seed_43/feature_cache/GUIDE-seq_9bit_r9_f8d0f2a98934f5dc.npy
  run_c9: runs/full_upgrade_guide_seq_conmismatch9/seed_43/feature_cache/GUIDE-seq_9bit_c9_cb0f43f00e46ef71.npy
  verify_first_n: 64

sampling:
  observed_positive_cap: all
  unobserved_candidate_cap: all

split:
  train: 0.70
  val: 0.15
  test: 0.15

evaluation:
  batch_size: 1024
  cpu_threads: 8
  num_workers: 0
  weight_grid_start: 0.0
  weight_grid_stop: 1.0
  weight_grid_step: 0.01
  threshold: 0.5

outputs:
  dir: results/bl0_weighted_average/guide_seq_seed43
  append_experiments_csv: true
  experiments_csv: results/experiments.csv
