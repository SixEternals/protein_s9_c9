version: BL3-ablation-run-only
model: bl3_hard_prior
seed: 42
device: auto

dataset:
  name: GUIDE-seq
  file: /data/zwf/project/zhb/data/GUIDE-seq/GUIDE-seq_9bit.npz

run_encoder:
  weight_mode: soft

model_config:
  cnn_channels: [64, 128]
  kernel_size: 3
  dropout: 0.3
  mlp_hidden_dim: 64
  use_region: false
  use_run: true
  learnable_seed_weights: false

training:
  epochs: 50
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  monitor: auprc
  monitor_mode: max
  num_workers: 8

outputs:
  dir: results/bl3_ablation_run
  experiments_csv: results/experiments.csv
