# BL5-v4-LearnableRun-PAM-noRNAFM-control Smoke Test
version: "BL5-v4-LearnableRun-PAM-noRNAFM-control-Smoke"
description: "smoke test: LearnableRunEncoder + PAM Encoder, no RNA-FM"

model:
  name: BL5RunOnlyDynamicFusion
  use_rnafm: false
  freeze_rnafm: false
  use_run: true
  use_learnable_run: true
  use_region: false
  use_pam_encoder: true
  fusion_type: run_pam_concat
  pam_dim: 16
  d_model: 128
  mlp_hidden: 256
  mlp_hidden2: 64
  mlp_activation: relu
  dropout: 0.3
  dropout2: 0.2

rnafm:
  checkpoint_path: data/rnafm/checkpoints/RNA-FM_pretrained.pth
  freeze_rnafm: false
  repr_layer: 12

training:
  epochs: 1
  batch_size: 256
  lr_run_encoder: 1.0e-3
  lr_pam_encoder: 1.0e-3
  lr_mlp: 1.0e-3
  lr: 1.0e-3
  warmup_epochs: 1
  optimizer: AdamW
  use_param_groups: true
  focal_loss: true
  focal_gamma: 2.0
  gradient_clip: 1.0
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  find_unused_parameters: false
  weight_decay: 1.0e-5
  monitor: auprc
  monitor_mode: max
  max_train_batches: 5
  max_eval_batches: 5

split_mode: sgrna_safe

split:
  strategy: formal_group_json
  formal_split_json: formal_split_bl5_seed42.json
  group_column: sgRNA_type

data:
  cclmoff_csv: data/cclmoff/09212024_CCLMoff_dataset.csv
  npz_path: data/cclmoff/cclmoff_9bit.npz
  group_column: sgRNA_type

evaluation:
  checkpoint_type: best
  report_metrics: [AUROC, AUPRC]

hardware:
  gpu_count: 2
  use_amp: true
  use_ddp: true

output_dir: results/bl5_v4_learnablerun_pam_nornafm_control_smoke

outputs:
  export_test_predictions: false
